# Lexical eval — mostly **search recall@K**. Identical-word acceptance is a
# deterministic rule (see lexical-accept.ts); cases here check it does not
# fire on near-siblings or synonyms.
#
# Inputs drawn from:
#   - dataset/foodex2-gold.yaml on experiment/alternative-encoding-workflow
#     (CoFID UK + CIQUAL France pool rows, base term only)
#   - EFSA hand-check / guide examples on this branch
#   - Crafted reorder and near-sibling negatives
#
# Fields per case:
#   expected       base term code (omit when testing "no accept" only)
#   recall_top     expected must appear in top K (default 10)
#   auto_accept    true = should auto-accept to expected; false = must not accept
#   forbid_accept  comma-separated codes — auto-accept to any of these is failure
#   tags           comma-separated labels for grouping in the report

cases:
  # --- Reorder / token-set positives (crafted) ---
  - id: lex-reorder-orange-juice
    input: orange juice
    expected: A03AM
    tags: positive, reorder, crafted
    auto_accept: true
    note: Juice, orange

  - id: lex-reorder-juice-orange
    input: juice orange
    expected: A03AM
    tags: positive, reorder, crafted
    auto_accept: true

