# End-to-end encode eval — focused regression set (one case per capability).
# Requires a model key. Run: npm run encode-eval
# Results (model, MTX, outcomes) land in eval/results/encode-base-term.json.
#
# Fields per case:
#   capability            one sentence naming the interest under test (required; public label)
#   expected              base term code(s) the pick must be among (comma-separated any-of;
#                         first entry is preferred / shown in reports)
#   method                lexical | traversal — optional path check
#   forbid_pick           comma-separated codes — pick must not be any of these
#   forbid_facets         comma-separated Fxx.CODE — added facets must not include these
#   require_facets        comma-separated Fxx.CODE — all must appear as added facets
#   require_f04_under     comma-separated F04.CODE — for each, at least one added F04 must be under it
#   free_text_includes    substring of formatted freeText (label=value; …) must contain (case-insensitive)
#   tags                  soft = non-blocking for exit; otherwise free-form
#   note                  internal rationale (not shown as the public capability)

cases:
  # --- Catalogue only (lexical, no model) ---
  - id: encode-orange-juice
    input: orange juice
    expected: A03AM
    method: lexical
    capability: Matches a catalogue term when word order differs from the preferred name.
    tags: lexical
    note: Juice, orange — token-set match, auto-accept

  - id: encode-dill-seeds
    input: Dill seeds
    expected: A018F
    method: lexical
    capability: Matches a real nutrient-database label using catalogue vocabulary alone.
    tags: lexical
    note: CoFID Dill seeds → Dill seed

  # --- Synonyms ---
  - id: encode-eggplant
    input: eggplant
    expected: A00JD
    method: traversal
    capability: Resolves a synonym the catalogue already lists as an alternate name.
    tags: synonym
    note: Aubergines — alt name Eggplants in search-names; preferred name differs so lexical does not auto-accept

  - id: encode-arugula
    input: arugula
    expected: A00LN, A00LP
    method: traversal
    capability: Resolves a synonym absent from the catalogue entirely (model bridges it).
    tags: synonym
    note: Roman rocket (Eruca, preferred) or Wall rocket (Diplotaxis) — both sold as arugula; name absent from catalogue data

  # --- Dishes ---
  - id: encode-boeuf-bourguignon
    input: boeuf bourguignon
    expected: A03VY
    method: traversal
    require_f04_under: F04.A0EYH
    forbid_facets: F04.A0EYH
    free_text_includes: dish=boeuf bourguignon
    capability: Encodes a named dish as the dish class, with meat as F04 and the name in free text.
    tags: dish
    note: Meat stew + F04 more specific than mammals meat

  - id: encode-risotto-asparagus
    input: Risotto with asparagus
    expected: A041F
    method: traversal
    forbid_pick: A00RT
    capability: Prefers the dish name over a characterising ingredient as the base term.
    tags: dish
    note: EFSA handcheck — Risotto, not Asparagus

  - id: encode-homemade-yakitori
    input: homemade yakitori
    expected: A03VV
    method: traversal
    free_text_includes: yakitori
    capability: Keeps an unknown modifier in free text and does not invent dish-definition facets.
    tags: dish
    note: Named-dish span owned; uncovered homemade may be note=

  - id: encode-sandwich-bare
    input: sandwich
    expected: A03YZ
    method: traversal
    forbid_facets: F04.A02QE,F04.A0EYM,F04.A026V,F04.A07XJ
    capability: Does not invent fillings for a bare composite dish name.
    tags: dish
    note: Base already expresses sandwich

  # --- Processing and facets ---
  - id: encode-smoked-sprats-canned
    input: smoked sprats in a can
    expected: A0FBY
    method: traversal
    forbid_pick: A0EYS
    capability: Treats processing (smoking) as a facet, not as the base term (EFSA §3.1.3).
    tags: process
    note: Canned sprats, not Smoked fish

  - id: encode-ice-cream-topping
    input: chocolate ice cream with amarena cherries
    expected: A02QA
    method: traversal
    require_f04_under: F04.A01GH
    forbid_facets: F04.A01KJ,F04.A06MF,F04.A06MG,F04.A06MH,F04.A06JV
    free_text_includes: ingredient=chocolate
    capability: Adds a stated topping as F04 and sends an uncodable residue to free text.
    tags: soft, facets
    note: Soft — model may take Chocolate flavour as F04 and dump cherries to side=; want sour-cherry F04 + ingredient=chocolate (not flavour chemicals)

  - id: encode-buffalo-mozzarella
    input: buffalo mozzarella
    expected: A02QJ
    method: traversal
    require_facets: F27.A02MD
    capability: Attaches a source-commodity origin facet (water buffalo milk).
    tags: facets
    note: Mozzarella + F27 Water buffalo milk

  - id: encode-canned-organic-orange-juice
    input: canned organic orange juice
    expected: A03AM
    method: traversal
    require_facets: F21.A07SE,F28.A0BYP
    capability: Adds production-method and preservation facets on a known juice base.
    tags: facets
    note: Juice, orange + Organic + Canning/jarring

  - id: encode-orange-nectar-long
    input: Orange nectar, fortified with calcium, sugar free, organic
    expected: A03BG
    method: traversal
    require_facets: F09.A0EXH,F10.A077L,F21.A07SE
    forbid_facets: F04.A0EXH
    capability: Handles a long real product label with several facets at once.
    tags: facets
    note: Nectar, orange + Calcium (F09) + Sugar free + Organic; Calcium as F04 is the wrong facet

  - id: encode-fortified-bare
    input: fortified breakfast cereal
    expected: A00CV
    method: traversal
    require_facets: F10.A0F6C
    capability: Codes a bare fortification claim (no nutrient named) as qualitative Fortified.
    tags: facets
    note: Breakfast cereals + F10 Fortified; no F09 agent to invent

  - id: encode-fortified-two-agents
    input: orange juice fortified with calcium and vitamin D
    expected: A03AM
    method: traversal
    require_facets: F09.A0EXH,F09.A0EXM
    forbid_facets: F04.A0EXH,F10.A0F6C
    capability: Places two named fortification agents as F09 and does not also add bare Fortified or Calcium as F04.
    tags: facets
    note: Juice, orange + Calcium + Vitamin D; agents imply fortified so F10 Fortified is redundant

  - id: encode-mixed-nuts
    input: mixed nuts (almonds, walnuts and hazelnuts)
    expected: A014C
    method: traversal
    require_facets: F27.A014D,F27.A014R,F27.A014L
    forbid_facets: F26.A07XE,F28.A0CRL
    capability: Encodes a same-nature mix as the group plus F27 members (not Mixing / Other).
    tags: soft, facets
    note: Soft — F27 members are required; model sometimes also adds F28 Mixing (same-nature mix is not Mixing)

  # --- Catalogue gaps and restraint ---
  - id: encode-quinoa-flour
    input: Quinoa flour
    expected: A04KT
    method: traversal
    forbid_pick: A04KS
    capability: Falls back to the correct not-listed bucket when no dedicated leaf exists.
    tags: gap
    note: Cereal flours not separately listed

  - id: encode-kangaroo-meat
    input: kangaroo meat
    expected: A0EYF
    method: traversal
    forbid_pick: A01RS
    capability: Does not assume catalogue words (fresh) that the input does not state.
    tags: restraint
    note: Mammals meat — not Kangaroo fresh meat

  - id: encode-spirits-volume
    input: Spirits, 40% volume
    expected: A03PD
    method: traversal
    require_facets: F11.A07DL
    capability: Attaches a stated alcohol-by-volume percentage as F11 on the spirit class.
    tags: facets
    note: Unsweetened spirits + 40 % alcohol v/v; not nutrient-database noise to ignore

  - id: encode-milk-fat-percent
    input: cow milk, 1.5% fat
    expected: A02LZ, A02LV, A02LT
    method: traversal
    require_facets: F07.A06ZA
    capability: Attaches a stated fat percentage as F07 on a milk base.
    tags: facets
    note: Cow milk / semi-skimmed / Milk + 1.5 % fat; soft fat claims without a number stay off F07

  # --- Any-of gold ---
  - id: encode-semi-skimmed-milk
    input: semi-skimmed milk
    expected: A02LZ, A02LV
    method: traversal
    capability: Accepts either the denser milk leaf or its parent when both are defensible.
    tags: any_of
    note: Cow milk, semi skimmed (preferred) or Cow milk
