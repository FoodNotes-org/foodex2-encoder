    rules: BT-11
    base: A001L, A0D9P
    misread: A07KG, A0C03
    note: >-
      Durra grain's scope note is Sorghum bicolor subsp. bicolor, known as milo, which covers
      cultivated grain sorghum; Sorghum grain lists Durra and Milo among its names too. The
      scope notes overlap, so both are accepted (Jorn, 2026-11-13).

  - id: eval-oj-from-concentrate
