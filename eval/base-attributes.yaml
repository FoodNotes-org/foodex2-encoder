    note: Reconstituted juice is juice, not a concentrate.

  # --- F6: words that show the form of the food ---
  - id: usda-egg-frozen-pasteurized
    input: Egg, whole, raw, frozen, pasteurized
    country: US
    source: usda-fdc-foundation
    families: F6, F8, F9
    rules: BT-12, BT-10, BT-03
    base: A031R, A0F6E
    forbid_base: A04NZ, A031G
    facet_only: A07KQ, A07HV
    form: frozen
    note: Frozen whole egg is out of the shell and mixed; Processed eggs is a hierarchy term.

  - id: usda-eggs-grade-a
