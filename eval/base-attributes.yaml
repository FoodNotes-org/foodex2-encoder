  - id: new-rice-parboiled
    input: rice grain, parboiled
    country: EU
    source: new
    families: F2, F7, F9
    rules: BT-03, BT-05
    base: A001D
    forbid_base: A003E
    facet_only: A07LK
    misread: A07GG
    note: Rice grain, parboiled is not reportable.

  - id: new-pork-boiled
    input: pork, boiled
    country: EU
    source: new
    families: F2, F3
    rules: BT-03, BT-02
    base: A01RG
    facet_only: A07GL

  # --- F3: a treatment makes a new food only for some foods ---
  - id: new-egg-boiled
    input: hen egg, boiled
    country: EU
    source: new
    families: F3
    rules: BT-02, BT-07
    base: A032B
    new_food: A07GL|A07GG
    note: Cooking in water applies to eggs in Table 5.

  - id: usda-chorizo-pan-fried
    input: Sausage, pork, chorizo, link or ground, cooked, pan-fried
    country: US
