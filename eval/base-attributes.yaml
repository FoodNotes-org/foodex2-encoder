    families: F2
    rules: BT-03
    base: A07Y0
    facet_only: A07KQ

  - id: usda-oj-refrigerated
    input: Orange juice, no pulp, not fortified, not from concentrate, refrigerated
    country: US
    source: usda-fdc-foundation
    families: F2, F5
    rules: BT-03
    base: A03AM
    new_food: A07LN
    facet_only: A07KP
    misread: A07KF

  - id: usda-grapefruit-juice-refrigerated
    input: Grapefruit juice, red, not fortified, not from concentrate, refrigerated
    country: US
    source: usda-fdc-foundation
    families: F2, F5
    rules: BT-03
    base: A03AL
    new_food: A07LN
    facet_only: A07KP
    misread: A07KF

  - id: eval-canned-organic-oj
    input: canned organic orange juice
    country: EU
    source: eval encode-canned-organic-orange-juice
    families: F2, F3
    rules: BT-02, BT-03
    base: A03AM
    new_food: A07LN
    facet_only: A0BYP
    note: Canning makes a new food only for vegetables, fruit, meat, fish and seafood (Table 4); on a juice it is a facet.

  - id: nevo-cod-boiled
    input: Kabeljauw gekookt
    country: NL
    source: nevo-online-2025
    families: F2, F3
    rules: BT-03, BT-02
    base: A02BX
    forbid_base: A02BV
    facet_only: A07GL
    note: >-
      Cooking in water makes a new food only for eggs (Table 5). In the Netherlands the bare
      name "kabeljauw" is reserved for Gadus morhua; Pacific and Greenland cod must be sold as
      "Pacifische" and "Groenlandse kabeljauw" (Warenwetregeling handelsbenamingen vis, 5.1).
      Departs from RIVM's published A02BV (Jorn, 2026-11-13).

  - id: nevo-sprouts-boiled
    input: Spruitjes gekookt
    country: NL
    source: nevo-online-2025
    families: F2, F3
    rules: BT-03, BT-02
    base: A00FV
