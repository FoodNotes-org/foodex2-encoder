    base: A024G
    forbid_base: A025J
    facet_only: A07GS
    note: US ground chorizo is fresh and not cured, and is cooked before eating. Pan-frying is a kitchen treatment, not cooking during production (Jorn, 2026-11-12).

  - id: cofid-courgette-fried
    input: Courgette, fried in corn oil
    country: GB
    source: cofid-2021
    families: F3
