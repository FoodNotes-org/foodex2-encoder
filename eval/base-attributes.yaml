    country: EU
    source: new
    families: F7
    rules: BT-15
    base: A034R
    note: >-
      Eaten as a chocolate sweet, and Chocolate coated confectionery's scope covers it (BT-15).
      Departs from Table 10, which lists chocolate-coated nuts as commodity plus minor
      ingredient (Jorn, 2026-11-13).

