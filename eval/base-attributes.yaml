# Base-term attribute fixture — tests only the base-term decision for a
# foodstuff: which stated treatments make a new food (and so pick the base),
# which stay facets, and which base results. Rules and families refer to
# rules/base-term.yaml.
#
# Run: npm run base-eval [-- --runs 3 --concurrency 12 --only id,id]
# Results land in eval/results/base-attributes.json.
#
# Fields per case:
#   input        food description as the source gives it
#   country      ISO code, or EU
#   source       where the row comes from (eval set, reference-set file, or new)
#   families     case families in rules/base-term.yaml (F1..F9)
#   rules        rules the case exercises (BT-nn)
#   base         expected base term(s), any-of; first is preferred
#   forbid_base  base terms the pick must not be
#   new_food     treatments that must be judged to make a new food; each entry
#                may be A|B; a more specific treatment under one counts
#   facet_only   treatments that must stay facets: not judged to make a new
#                food (the treatment, a broader or a narrower one)
#   misread      treatments the description does not state as making a new
#                food; same check as facet_only
#   form         words that show the physical form of the food and must stay
#                in the description the walk compares with
#   open         true = expected base is undecided; reported, not scored
#   note         rationale

cases:
  # --- F1: a treatment makes a new food; the base is the group for it ---
  - id: usda-sorghum-puffed
    input: Sorghum, puffed
    country: US
    source: usda-fdc-foundation
    families: F1
    rules: BT-02, BT-07
    base: A04LL
    new_food: A07LL
    note: Puffing is in Table 4; Popped cereals implies it.

  - id: efsa-smoked-sturgeon
    input: smoked Adriatic sturgeon meat
    country: EU
    source: efsa-foodex2-guidance-2015
    families: F1
    rules: BT-02, BT-07
    base: A0EYS
    new_food: A07JV

  - id: new-smoked-salmon
    input: smoked salmon
    country: EU
    source: new
    families: F1
    rules: BT-02, BT-07
    base: A02KF
    forbid_base: A02KD
    new_food: A07JV
    note: Classified as smoked fish + salmon, not salmon + smoking; Smoked salmon is that group.

  - id: efsa-dried-kangaroo
    input: dried kangaroo meat
    country: EU
    source: efsa-foodex2-guidance-2015
    families: F1
    rules: BT-02, BT-07
    base: A04MP
    new_food: A07KG

  - id: efsa-maize-groats
    input: maize groats
    country: EU
    source: efsa-foodex2-guidance-2015
    families: F1, F9
    rules: BT-02
    base: A0BY1
    note: >-
      No maize groats term exists. Groats is roughly crushed cereal and maize is the source.
      Maize semolina is a different product (Jorn, 2026-11-12). The word groats names the
      product, not a stated process; Groats itself carries grinding, not grain milling, so no
      new-food process is expected (Jorn, 2026-11-13).

  - id: efsa-glutinous-rice-flour
    input: flour obtained from glutinous rice
    country: EU
    source: efsa-foodex2-guidance-2015
    families: F1
    rules: BT-02
    base: A003F
    new_food: A0C03

  - id: efsa-quinoa-flour
    input: Quinoa flour
    country: EU
    source: eval encode-quinoa-flour / efsa-foodex2-guidance-2015
    families: F1
    rules: BT-02, BT-07
    base: A04KT
    forbid_base: A04KS
    new_food: A0C03
    misread: A0C0G

  - id: usda-quinoa-flour-pregelatinized
    input: Quinoa flour, pre-gelatinized, organic
    country: US
    source: usda-fdc-foundation
    families: F1, F8
    rules: BT-02, BT-08
    base: A04KT
    new_food: A0C03
    facet_only: A07LK
    misread: A0C0G
    note: Pre-gelatinising has no group for quinoa flour; it stays a facet.

  - id: nevo-dried-pears
    input: Peren gedroogd
    country: NL
    source: nevo-online-2025
    families: F1
    rules: BT-02
    base: A01MH
    new_food: A07KG

  - id: nevo-rice-flour-wholegrain
    input: Meel rijst- volkoren
    country: NL
    source: nevo-online-2025
    families: F1
    rules: BT-02
    base: A003F
    new_food: A0C03

  - id: cofid-potato-chips
    input: Potato chips, fried in commercial oil, from takeaway fish and chip shops
    country: GB
    source: cofid-2021
    families: F1
    rules: BT-02, BT-07
    base: A0BYV
    new_food: A07GR
    note: Frying applies to potatoes in Table 5.

  - id: cofid-butter-beans-canned
