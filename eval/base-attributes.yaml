  - id: new-mackerel-smoked-canned
    input: canned smoked mackerel
    country: EU
    source: new
    families: F4
    rules: BT-06
    base: A0FBV
    forbid_base: A16EM
    new_food: A07JV, A0BYP

  - id: new-cod-dried-salted
    input: dried salted cod
    country: EU
    source: new
    families: F4
    rules: BT-06
    base: A0FCB
    forbid_base: A02JS
    new_food: A07KG, A07JP
    note: Salted outranks dried.

  - id: efsa-candied-peel-chocolate
    input: candied citrus peel, chocolate-coated
    country: EU
    source: efsa-foodex2-guidance-2015
    families: F4, F7
    rules: BT-15
    base: A034R
    new_food: A07JQ|A07JR
    note: >-
      Both a candied fruit and a chocolate-coated confection; neither term contains the other,
      so the kind of product it is primarily eaten as decides (BT-15). Departs from EFSA's 5.13
      code A01PS (Jorn, 2026-11-13).

