    country: GB
    source: cofid-2021
    families: F1, F2
    rules: BT-02, BT-03
    base: A01AZ
    new_food: A0BYP
    facet_only: A07HD

  - id: eval-canned-peaches
    input: canned peaches in fruit juice
    country: EU
