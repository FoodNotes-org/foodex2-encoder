  - id: cofid-chicken-stir-fried
    input: Chicken, breast, strips, stir-fried in corn oil
    country: GB
    source: cofid-2021
    families: F3
    rules: BT-02, BT-03
    base: A01SP
    facet_only: A07GT

  - id: cofid-pork-mince-stewed
    input: Pork, mince, stewed
    country: GB
    source: cofid-2021
    families: F3, F6
    rules: BT-03, BT-12
    base: A04AC
    facet_only: A07GM
    misread: A07GG
    form: mince

  - id: cofid-duck-roasted
    input: Duck, roasted, meat, fat and skin
    country: GB
    source: cofid-2021
    families: F3, F9
    rules: BT-03, BT-10
    base: A01SR
    forbid_base: A01QR
    facet_only: A07GY
    note: The bird as eaten, fat and skin on. Duck fresh meat allows intrinsic fat; with skin is the part consumed. A01SR#F20.A07QQ$F28.A07GY. Meat and meat products is a hierarchy term (Jorn, 2026-11-12).

  - id: cofid-sweet-white-sauce
    input: White sauce, sweet, made with skimmed milk, homemade
    country: GB
    source: cofid-2021
    families: F7
    rules: BT-15
    base: A046F
    forbid_base: A0F1N, A043X
    note: >-
      By their scope notes the food can be both a béchamel (milk sauce with a roux) and a
      dessert sauce (sweet, for desserts); neither term contains the other. It is primarily
      eaten as a dessert sauce (BT-15, Jorn, 2026-11-13).

  # --- F4: two treatments compete (Table 6 priority) ---
  - id: eval-smoked-sprats-canned
