    families: F1
    rules: BT-02
    base: A01NY
    new_food: A0BYP

  - id: eval-canned-shellfish
    input: canned shellfish
    country: EU
    source: eval encode-canned-shellfish
    families: F1
    rules: BT-02
    base: A0BZ5
    new_food: A0BYP

  - id: eval-tuna-brine
    input: tuna in brine, canned
    country: EU
    source: eval encode-tuna-brine
    families: F1
    rules: BT-02, BT-06
    base: A0FBT
    new_food: A0BYP

  - id: eval-sardines-olive-oil
    input: sardines in olive oil, canned
    country: EU
    source: eval encode-sardines-olive-oil
    families: F1
    rules: BT-02
    base: A0FBZ
    new_food: A0BYP

