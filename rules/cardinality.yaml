    second: error

  F27:
    label: Source-commodities
    flag: repeatable
    guidance_2015: Single (repeatable for mixed raw commodities or derivatives)
    description: "More than one descriptor can be applied to each entry, provided they are not contradicting each other."
    # When several are allowed is decided by BR01, BR05 and BR07, not by cardinality.
    second: allowed

  F28:
    label: Process
    flag: repeatable
    guidance_2015: Repeatable
    description: "More (none contradicting) descriptors can be applied to each entry."
    second: allowed

  F29:
    label: Purpose-of-raising
    flag: repeatable
    guidance_2015: Repeatable
    description: "More than one descriptor can be applied to each entry, provided they are not contradicting each other."
    second: allowed

  F30:
    label: Reproductive-level
    flag: single
    guidance_2015: Single
    description: "More than one descriptor can be applied to each entry, provided they are not contradicting each other."
    second: error
    conflict: cardinality-F01-F30-F32

  F31:
    label: Animal-age-class
    flag: repeatable
    guidance_2015: Single Repeatable
    description: "More than one descriptor can be applied to each entry, provided they are not contradicting each other."
    second: allowed

  F32:
    label: Gender
    flag: single
    guidance_2015: Single
    description: "More than one descriptor can be applied to each entry, provided they are not contradicting each other."
    second: error
